services:
  # Backend API - base de données hébergée sur Supabase (voir Dashboard Render > Environment)
  - type: web
    name: moni-api
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    envVars:
      # Renseignés manuellement dans le Dashboard Render (Environment > Secret File ou Env Vars)
      # car ce sont des secrets Supabase qui ne doivent pas être committés.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRATION
        value: 30d
    healthCheckPath: /
